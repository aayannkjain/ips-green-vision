// ─── storage ───
function load(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch { return false; } }


// ─── posts from Supabase (everyone can view; likes & comments need log in) ───
function getSupabase() {
  return window.ipsSupabase || Promise.reject(new Error("The login service did not load."));
}
function friendlyPostError(e) {
  const m = (e && e.message) || String(e || "");
  if (/not set up yet/i.test(m)) return "Posts are not available yet: the website owner must add the Supabase settings in navbarsdg.js.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Could not reach the server. Check your internet connection.";
  if (/row-level security|JWT|not authenticated/i.test(m)) return "Please log in again to do this.";
  return m || "Something went wrong.";
}
function formatWhen(iso) {
  return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
}
// Loads posts (optionally for one goal) with author names, likes and comments.
async function fetchPosts(goalId, limit = 100) {
  const sb = await getSupabase();
  let query = sb.from("post").select("*").order("createdAt", { ascending: false }).limit(limit);
  if (goalId) query = query.eq("goalId", goalId);
  const { data: posts, error } = await query;
  if (error) throw error;
  if (!posts.length) return [];
  const ids = posts.map(p => p.id);
  const [likes, comments] = await Promise.all([
    sb.from("post_like").select("postId,userId").in("postId", ids),
    sb.from("post_comment").select("*").in("postId", ids).order("createdAt", { ascending: true }),
  ]);
  if (likes.error) throw likes.error;
  if (comments.error) throw comments.error;
  const userIds = [...new Set([...posts.map(p => p.userId), ...comments.data.map(c => c.userId)])];
  const { data: authors, error: authorError } = await sb.from("public_author").select("*").in("id", userIds);
  if (authorError) throw authorError;
  const nameOf = id => { const a = authors.find(x => x.id === id); return a ? `${a.firstName} ${a.lastName}` : "Student"; };
  const orgOf = id => { const a = authors.find(x => x.id === id); return (a && a.orgName) || ""; };
  return posts.map(p => ({
    ...p,
    author: nameOf(p.userId),
    orgName: orgOf(p.userId),
    imageUrl: sb.storage.from("post-images").getPublicUrl(p.imagePath).data.publicUrl,
    likes: likes.data.filter(l => l.postId === p.id).map(l => l.userId),
    comments: comments.data.filter(c => c.postId === p.id).map(c => ({ ...c, author: nameOf(c.userId) })),
  }));
}
function usePosts(goalId, limit) {
  const [state, setState] = useState({ loading: true, posts: [], error: "" });
  const reload = useCallback(() => {
    fetchPosts(goalId, limit)
      .then(posts => setState({ loading: false, posts, error: "" }))
      .catch(e => setState({ loading: false, posts: [], error: friendlyPostError(e) }));
  }, [goalId, limit]);
  useEffect(() => { reload(); }, [reload]);
  return [state, reload];
}
// The logged-in user (or null), kept up to date when they log in / out
function useMe() {
  const [me, setMe] = useState(() => window.ipsCurrentProfile?.() || null);
  useEffect(() => {
    const update = () => setMe(window.ipsCurrentProfile?.() || null);
    window.addEventListener("ips-profile-change", update);
    return () => window.removeEventListener("ips-profile-change", update);
  }, []);
  return me;
}

function PostInteractions({ post, me, onChanged, responseLabel = "Comment" }) {
  const [showResponse, setShowResponse] = useState(false);
  const [response, setResponse] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const liked = !!me && post.likes.includes(me.id);
  const askLogin = () => window.ipsOpenLogin ? window.ipsOpenLogin("login") : null;

  const run = async (action) => {
    if (!me) { askLogin(); return; }
    setBusy(true); setError("");
    try {
      const sb = await getSupabase();
      const { error } = await action(sb);
      if (error) throw error;
      onChanged();
      return true;
    } catch (e) { setError(friendlyPostError(e)); return false; }
    finally { setBusy(false); }
  };
  const toggleLike = () => run(sb => liked
    ? sb.from("post_like").delete().eq("postId", post.id).eq("userId", me.id)
    : sb.from("post_like").insert({ postId: post.id, userId: me.id }));
  const submitResponse = async () => {
    const text = response.trim();
    if (!text || busy) return;
    const ok = await run(sb => sb.from("post_comment").insert({ postId: post.id, userId: me.id, text }));
    if (ok) { setResponse(""); setShowResponse(false); }
  };
  const btn = { border: "none", borderRadius: 8, padding: "7px 11px", cursor: "pointer", fontSize: 13, fontFamily: "'DM Sans',sans-serif", fontWeight: 600 };

  return (
    <div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button type="button" disabled={busy} onClick={toggleLike} aria-pressed={liked} title={me ? "" : "Log in to like"} style={{ ...btn, background: liked ? "#FEE2E2" : T.bg, color: liked ? "#DC2626" : T.muted }}>
          {liked ? "♥" : "♡"} {post.likes.length}
        </button>
        <button type="button" onClick={() => me ? setShowResponse(!showResponse) : askLogin()} style={{ ...btn, background: T.bg, color: T.textSec }}>
          💬 {responseLabel}{post.comments.length ? ` (${post.comments.length})` : ""}

const MAX_IMAGE_BYTES = 2 * 1024 * 1024;   // 2 MB
const MAX_DESC = 500;
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("This picture format is not supported. Please use a JPG or PNG photo.")); };
    img.src = url;
  });
}
// Big phone photos are resized and compressed until they are 2 MB or less (also removes hidden GPS data)
async function shrinkImage(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error("Please choose an image file (JPG, PNG or WEBP).");
  const img = await loadImageFile(file);
  let side = 1600, quality = 0.85;
  for (let tries = 0; tries < 8; tries++) {
    const scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", quality));
    if (blob && blob.size <= MAX_IMAGE_BYTES) return blob;
    if (quality > 0.55) quality -= 0.1; else { side = Math.round(side * 0.8); quality = 0.8; }
  }
  throw new Error("This image is too large even after shrinking (max 2 MB). Please choose another photo.");
}

function AddPostForm({ sdg, onCancel, onPosted }) {
  const [files, setFiles] = useState([]);
  const [previews, setPreviews] = useState([]);
  const [desc, setDesc] = useState("");
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState("");
  const [formError, setFormError] = useState("");
  const fileRef = useRef(null);

  useEffect(() => () => { previews.forEach(url => URL.revokeObjectURL(url)); }, [previews]);

  const pickFiles = async (e) => {
    const selected = Array.from(e.target.files || []);
    setFiles([]);
    previews.forEach(url => URL.revokeObjectURL(url));
    setPreviews([]);
    setErrors(x => ({ ...x, image: "" }));
    if (!selected.length) return;
    if (selected.length > 10) {
      setErrors(x => ({ ...x, image: "Please select up to 10 images at a time." }));
      if (fileRef.current) fileRef.current.value = "";
      return;
    }
    setBusy(`Preparing ${selected.length} file${selected.length === 1 ? "" : "s"}…`);
    try {
      const prepared = [];
      for (const file of selected) {
        if (!file.type.startsWith("image/")) throw new Error(`"${file.name}" is not an image. Please choose JPG, PNG or WEBP files.`);
        prepared.push({ name: file.name, blob: await shrinkImage(file) });
      }
      setFiles(prepared);
      setPreviews(prepared.map(item => URL.createObjectURL(item.blob)));
    } catch (err) {
      setErrors(x => ({ ...x, image: err.message }));
      if (fileRef.current) fileRef.current.value = "";
    } finally {
      setBusy("");
    }
  };

  const submit = async (e) => {
    e.preventDefault();
    setFormError("");
    const text = desc.trim();
    const errs = {
      image: files.length ? "" : (errors.image || "Please upload at least one image."),
      desc: !text ? "Please describe what you did for this goal." : text.length > MAX_DESC ? "Description must be 500 characters or fewer." : "",
    };
    setErrors(errs);
    if (errs.image || errs.desc) return;
    setBusy("Posting…");
    const uploadedPaths = [];
    try {
      const sb = await getSupabase();
      const { data } = await sb.auth.getSession();
      const user = data && data.session && data.session.user;
      if (!user) throw new Error("not authenticated");

      // The current database schema stores one imagePath per post, so each
      // selected image is saved as its own post with the same description.
      for (const item of files) {
        const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
        const up = await sb.storage.from("post-images").upload(path, item.blob, { contentType: "image/jpeg", upsert: false });
        if (up.error) throw up.error;
        uploadedPaths.push(path);
      }
      const rows = uploadedPaths.map(path => ({
        userId: user.id, goalId: sdg.id, description: text, imagePath: path
      }));
      const ins = await sb.from("post").insert(rows);
      if (ins.error) throw ins.error;
      onPosted();
    } catch (err) {
      if (uploadedPaths.length) {
        try { await (await getSupabase()).storage.from("post-images").remove(uploadedPaths); } catch {}
      }
      setFormError(friendlyPostError(err));
      setBusy("");
    }
  };

  const label = { display: "block", fontSize: 13, fontWeight: 700, color: "#36563E", margin: "18px 0 7px", fontFamily: "'DM Sans',sans-serif" };
  const err = { color: "#DC2626", fontSize: 12, marginTop: 5, fontFamily: "'DM Sans',sans-serif" };
  return (
    <form onSubmit={submit} noValidate style={{ background: T.card, border: `2px solid ${sdg.color}`, borderRadius: 16, padding: 24, marginBottom: 28, boxShadow: T.shadow }}>
      <h2 style={{ margin: "0 0 4px", fontSize: 19, fontWeight: 700, color: T.text, fontFamily: "'Outfit',sans-serif" }}>➕ Add a post for SDG {sdg.id}</h2>
      <p style={{ margin: 0, fontSize: 13, color: T.textSec, fontFamily: "'DM Sans',sans-serif" }}>Upload multiple photos for your action. Each photo will appear as a separate Community post with the same description.</p>

      <label htmlFor="post-image" style={label}>Upload images <span style={{ color: "#DC2626" }}>*</span></label>
      <input ref={fileRef} id="post-image" type="file" accept="image/*" multiple onChange={pickFiles} disabled={!!busy} aria-invalid={!!errors.image}
        style={{ display: "block", width: "100%", padding: 12, border: `2px dashed ${errors.image ? "#DC2626" : T.border}`, borderRadius: 12, background: T.bg, fontFamily: "'DM Sans',sans-serif", cursor: "pointer" }} />
      <div style={{ fontSize: 12, color: T.muted, marginTop: 6, fontFamily: "'DM Sans',sans-serif" }}>Select up to 10 JPG, PNG or WEBP images. Each image is automatically compressed to 2 MB or less.</div>
      {errors.image && <div role="alert" style={err}>{errors.image}</div>}
      {previews.length > 0 && <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(110px,1fr))", gap: 10, marginTop: 14 }}>
        {previews.map((src, i) => <div key={src} style={{ minWidth: 0 }}>
          <img src={src} alt={`Selected image ${i + 1}`} style={{ display: "block", width: "100%", height: 110, borderRadius: 10, objectFit: "cover", background: T.bg }} />
          <div style={{ fontSize: 11, color: T.textSec, marginTop: 4, overflowWrap: "anywhere" }}>{files[i]?.name}</div>
        </div>)}
      </div>}

      <label htmlFor="post-desc" style={label}>Description <span style={{ color: "#DC2626" }}>*</span></label>
      <textarea id="post-desc" value={desc} maxLength={MAX_DESC} rows={4} disabled={!!busy} aria-invalid={!!errors.desc}
        onChange={e => { setDesc(e.target.value); if (errors.desc) setErrors(x => ({ ...x, desc: e.target.value.trim() ? "" : x.desc })); }}
        placeholder="Describe what you did for this goal"
        style={{ width: "100%", padding: "12px 14px", border: `1px solid ${errors.desc ? "#DC2626" : T.border}`, borderRadius: 10, background: errors.desc ? "#FFF7F7" : T.bg, color: T.text, fontSize: 15, lineHeight: 1.6, fontFamily: "'DM Sans',sans-serif", outline: "none", resize: "vertical", boxSizing: "border-box" }} />
      <div style={{ textAlign: "right", fontSize: 12, color: desc.length >= MAX_DESC ? "#DC2626" : T.muted, fontWeight: desc.length >= MAX_DESC ? 700 : 400, marginTop: 5, fontFamily: "'DM Sans',sans-serif" }}>{desc.length} / {MAX_DESC}</div>
      {errors.desc && <div role="alert" style={err}>{errors.desc}</div>}

      {formError && <div role="alert" style={{ marginTop: 14, padding: "10px 12px", borderRadius: 8, background: "#FFF1F2", color: "#B91C1C", fontSize: 13, fontFamily: "'DM Sans',sans-serif" }}>{formError}</div>}
      <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap" }}>
        <button type="submit" disabled={!!busy} style={{ minHeight: 44, padding: "0 26px", border: 0, borderRadius: 10, background: sdg.color, color: "#fff", fontWeight: 700, fontSize: 15, cursor: busy ? "wait" : "pointer", opacity: busy ? 0.7 : 1, fontFamily: "'DM Sans',sans-serif" }}>{busy || `Post ${files.length || ""} image${files.length === 1 ? "" : "s"}`}</button>
        <button type="button" onClick={onCancel} disabled={busy === "Posting…"} style={{ minHeight: 44, padding: "0 18px", border: 0, borderRadius: 10, background: "transparent", color: T.textSec, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>Cancel</button>
      </div>
    </form>
  );
}

function OrgFilter({ orgs, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const [find, setFind] = useState("");
  const boxRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const close = e => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    const esc = e => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", close); document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
  }, [open]);

  const all = selected.length === 0;   // nothing ticked = All
  const toggle = name => onChange(selected.includes(name) ? selected.filter(x => x !== name) : [...selected, name]);
  const label = all ? "All organizations" : selected.length === 1 ? selected[0] : `${selected.length} organizations selected`;
  const shown = orgs.filter(o => o.name.toLowerCase().includes(find.trim().toLowerCase()));
  const row = { display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: 8, cursor: "pointer", fontSize: 14, color: T.text, fontFamily: "'DM Sans',sans-serif" };

  return (
    <div ref={boxRef} style={{ position: "relative", flex: "1 1 260px", minWidth: 0 }}>
      <button type="button" aria-haspopup="listbox" aria-expanded={open} onClick={() => setOpen(!open)}
        style={{ width: "100%", minHeight: 46, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "0 14px", border: `1px solid ${open ? T.green : T.border}`, borderRadius: 10, background: "#fff", color: T.text, fontSize: 14, fontFamily: "'DM Sans',sans-serif", cursor: "pointer", textAlign: "left" }}>
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>🏫 {label}</span>
        <span aria-hidden="true" style={{ color: T.muted }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div role="listbox" aria-multiselectable="true" style={{ position: "absolute", zIndex: 50, top: "calc(100% + 6px)", left: 0, right: 0, background: "#fff", border: `1px solid ${T.border}`, borderRadius: 12, boxShadow: T.shadowLg, padding: 6, maxHeight: 320, overflowY: "auto" }}>
          {orgs.length > 8 && (
            <input value={find} onChange={e => setFind(e.target.value)} placeholder="Type to find…" autoFocus
              style={{ width: "100%", boxSizing: "border-box", margin: "2px 0 6px", padding: "9px 11px", border: `1px solid ${T.border}`, borderRadius: 8, fontSize: 13, fontFamily: "'DM Sans',sans-serif", outline: "none" }} />
          )}
          <label style={{ ...row, fontWeight: 700, background: all ? T.greenLight : "transparent" }}>
            <input type="checkbox" checked={all} onChange={() => onChange([])} /> All
          </label>
          {shown.map(o => (
            <label key={o.name} style={{ ...row, background: selected.includes(o.name) ? "#F0FDF4" : "transparent" }}>
              <input type="checkbox" checked={selected.includes(o.name)} onChange={() => toggle(o.name)} />
              <span style={{ flex: 1, overflowWrap: "anywhere" }}>{o.name}</span>
              <span style={{ color: T.muted, fontSize: 12 }}>({o.count})</span>
            </label>
          ))}
          {!shown.length && <div style={{ ...row, color: T.muted, cursor: "default" }}>No organization matches “{find}”.</div>}
        </div>
      )}
    </div>
  );
}

function CommunityPage() {
  const [state, reload] = usePosts(null, 500);
  const me = useMe();
  const [picked, setPicked] = useState([]);     // ticked in the dropdown ([] = All)
  const [applied, setApplied] = useState([]);   // used after clicking Search

  // Only organizations that have posts, with how many posts each
  const orgs = (() => {
    const counts = {};
    state.posts.forEach(p => { if (p.orgName) counts[p.orgName] = (counts[p.orgName] || 0) + 1; });
    return Object.keys(counts).sort((a, b) => a.localeCompare(b)).map(name => ({ name, count: counts[name] }));
  })();
  const posts = applied.length ? state.posts.filter(p => applied.includes(p.orgName)) : state.posts;
  const clear = () => { setPicked([]); setApplied([]); };

  return (
    <div style={{ maxWidth: 700, margin: "0 auto", padding: "28px 28px 60px" }}>
      <h1 style={{ fontSize: 26, fontWeight: 800, color: T.text, fontFamily: "'Outfit',sans-serif", marginBottom: 6 }}>🌍 Community</h1>
      <p style={{ fontSize: 15, color: T.textSec, fontFamily: "'DM Sans',sans-serif", marginBottom: 20 }}>See what students are doing for the SDGs. <a href="index.html" style={{ color: T.green, fontWeight: 700 }}>Add your own post from SDGs →</a></p>

      {!state.loading && !state.error && state.posts.length > 0 && (
        <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 14, padding: 16, marginBottom: 18, boxShadow: T.shadow }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#36563E", marginBottom: 8, fontFamily: "'DM Sans',sans-serif" }}>Filter by organization / school</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <OrgFilter orgs={orgs} selected={picked} onChange={setPicked} />
            <button type="button" onClick={() => setApplied(picked)}
              style={{ minHeight: 46, padding: "0 24px", border: 0, borderRadius: 10, background: T.green, color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>🔍 Search</button>
          </div>
          <div role="status" style={{ marginTop: 10, fontSize: 13, color: T.textSec, fontFamily: "'DM Sans',sans-serif" }}>
            {applied.length
              ? <>Showing {posts.length} post{posts.length === 1 ? "" : "s"} from {applied.length === 1 ? applied[0] : `${applied.length} organizations`} · <button type="button" onClick={clear} style={{ border: 0, background: "none", padding: 0, color: T.green, fontWeight: 700, cursor: "pointer", font: "inherit" }}>Clear</button></>
              : <>Showing all {state.posts.length} post{state.posts.length === 1 ? "" : "s"}</>}
          </div>
        </div>
      )}

      <PostFeed state={{ ...state, posts }} reload={reload} me={me} showGoal responseLabel="Comment" emptyIcon="🌱"
        emptyText={applied.length ? "No posts from the selected organizations yet." : "No community actions have been shared yet."} />
    </div>
  );
}

// ─── green targets ───
function GreenTargetsPage() {
  const [records, setRecords] = useState([]);
  const [selected, setSelected] = useState(null);
  const [description, setDescription] = useState("");
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState("");
  const [preview, setPreview] = useState("");
  const inputRef = useRef(null);
  const evidenceRef = useRef(null);
  const currentOwner = () => window.ipsCurrentProfile?.()?.id || "guest";
  const [owner, setOwner] = useState(currentOwner);
  useEffect(() => {
    const onChange = () => { setOwner(currentOwner()); setSelected(null); setFile(null); setDescription(""); };
    window.addEventListener("ips-profile-change", onChange);
    window.addEventListener("storage", onChange); // log-in from another tab
    return () => { window.removeEventListener("ips-profile-change", onChange); window.removeEventListener("storage", onChange); };
  }, []);
  useEffect(() => {
    if (selected && evidenceRef.current) {
      evidenceRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      evidenceRef.current.focus({ preventScroll: true });
    }
  }, [selected]);

  function database() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("ips-green-evidence", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("submissions", { keyPath: "key" });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(new Error("Browser storage is unavailable. Please enable storage and try again."));
    });
  }
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        if (!cancelled) { setReady(false); setError(""); }
        const db = await database();
        const tx = db.transaction("submissions", "readwrite");
        const store = tx.objectStore("submissions");
        let mine = [];
        const request = store.getAll();
        request.onsuccess = () => {
          const all = request.result;
          mine = all.filter(item => item.owner === owner);
          if (owner !== "guest") {
            // Evidence saved before logging in moves to this profile (unless the profile already has that SDG).
            const have = new Set(mine.map(r => r.sdgId));
            all.filter(item => item.owner === "guest" && !have.has(item.sdgId)).forEach(guest => {
              const moved = { ...guest, owner, key: owner + ":" + guest.sdgId };
              store.put(moved); store.delete(guest.key); mine.push(moved);
            });
          }
        };
        tx.oncomplete = () => { if (!cancelled) { setRecords(mine); setReady(true); } db.close(); };
        tx.onerror = tx.onabort = () => { if (!cancelled) setError("Could not load your saved evidence."); db.close(); };
      } catch (e) { if (!cancelled) setError(e.message); }
    })();
    return () => { cancelled = true; };
  }, [owner]);
  useEffect(() => {
    if (!file) { setPreview(""); return; }
    const url = URL.createObjectURL(file);
    setPreview(url);
    return () => URL.revokeObjectURL(url);
  }, [file]);
  const completed = new Set(records.filter(r => r.description?.trim() && r.media).map(r => r.sdgId));
  const done = completed.size;
  function openCertificate() {
    if (completed.size < 5) return;
    const profile = window.ipsCurrentProfile?.();
    const name = profile?.name || window.prompt("Name to display on your certificate:");
    if (!name?.trim()) return;
    const evidence = records.filter(r => completed.has(r.sdgId)).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    const completionDate = new Date(evidence[4].createdAt).toLocaleDateString(undefined, {day:"numeric",month:"long",year:"numeric"});
    const certificate = window.open("", "_blank", "width=1100,height=800");
    if (!certificate) { setError("Please allow pop-ups to open your certificate."); return; }
certificate.document.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPS Green Vision Certificate</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#eef5ef;color:#173c26;font-family:Georgia,serif}.certificate{max-width:1050px;margin:auto;background:#fffef8;border:8px double #287547;padding:42px;text-align:center;min-height:650px}.logo{width:80px;height:80px;object-fit:contain}.brand{font:700 16px Arial,sans-serif;letter-spacing:3px;margin:14px 0;color:#287547}.school{font:13px Arial,sans-serif;color:#66766a}h1{font-size:44px;font-weight:400;margin:30px 0 8px}.subtitle{font:12px Arial,sans-serif;text-transform:uppercase;letter-spacing:3px;color:#947139}.name{font-size:36px;border-bottom:1px solid #d4dfd5;display:inline-block;padding:10px 30px;margin:10px 0;overflow-wrap:anywhere}.copy{max-width:700px;margin:18px auto;line-height:1.8;font-size:17px}.goals{max-width:740px;margin:24px auto;padding:16px;background:#f0f6ed;font:13px/1.8 Arial,sans-serif}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:34px;font:12px/1.7 Arial,sans-serif}.note{font:11px Arial,sans-serif;color:#718071;margin-top:24px}.tools{text-align:center;margin-bottom:20px;font:14px Arial,sans-serif}.tools button{padding:12px 22px;border:0;border-radius:8px;background:#15803d;color:white;cursor:pointer}@page{size:A4 landscape;margin:12mm}@media print{body{padding:0;background:white}.tools{display:none}.certificate{width:100%;max-width:none;min-height:0;padding:25px;break-inside:avoid}h1{font-size:36px;margin-top:18px}.name{font-size:30px}.copy{margin:12px auto}.goals{margin:16px auto}.footer{margin-top:20px}}</style></head><body><div class="tools"><button id="print-certificate">Print / Save as PDF</button></div><main class="certificate"><img class="logo" id="certificate-logo" alt="Indirapuram Public School"><div class="brand">IPS GREEN VISION</div><div class="school">Indirapuram Public School</div><h1>Certificate of Achievement</h1><div class="subtitle">Five SDG Action Challenge</div><p class="copy">This certificate recognizes</p><div class="name" id="certificate-name"></div><p id="certificate-organization" class="school"></p><p class="copy">for documenting actions supporting five distinct Sustainable Development Goals, with photo or video evidence and a description for each goal.</p><div class="goals" id="certificate-goals"></div><div class="footer"><div>Completion date<br><strong id="certificate-date"></strong></div><div>IPS Green Vision<br>Dr. Ashish Mittal</div></div><p class="note">Automatically generated from self-reported submissions. This is an IPS Green Vision participation certificate, not a United Nations certification.</p></main></body></html>');
    certificate.document.close();
    certificate.document.getElementById("certificate-logo").src = new URL("indirapuram-public-school-logo.png", window.location.href).href;
    certificate.document.getElementById("certificate-name").textContent = name.trim();
    certificate.document.getElementById("certificate-organization").textContent = profile?.organization || "";
    certificate.document.getElementById("certificate-date").textContent = completionDate;
    certificate.document.getElementById("certificate-goals").textContent = evidence.slice(0,5).map(r => {const goal = SDGS.find(s => s.id === r.sdgId); return "SDG " + goal.id + " — " + goal.name.replace(/\n/g," ");}).join(" • ");
    certificate.document.getElementById("print-certificate").onclick = () => certificate.print();
  }
  function choose(sdg) {
    setSelected(sdg); setDescription(""); setFile(null); setPreview("");
    if (inputRef.current) inputRef.current.value = "";
  }
  function acceptFile(candidate) {
    if (!candidate) return;
    if (!/^(image|video)\//.test(candidate.type)) { setError("Choose a photo or video."); return; }
    setError(""); setFile(candidate);
  }
  async function submit(event) {
    event.preventDefault();
    if (!selected || !description.trim() || !file || busy || !ready) return;
    setBusy(true); setError("");
    try {
      const record = { key: owner + ":" + selected.id, owner, sdgId: selected.id,
        description: description.trim(), media: file, mediaType: file.type,
        fileName: file.name, createdAt: new Date().toISOString() };
      const db = await database();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction("submissions", "readwrite");
          tx.objectStore("submissions").put(record);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(new Error("Could not save your evidence. Browser storage may be full."));
          tx.onabort = () => reject(new Error("Evidence was not saved. Please check browser storage space."));
        });
      } finally { db.close(); }
      setRecords(previous => [...previous.filter(r => r.sdgId !== record.sdgId), record]);
      setSelected(null); setFile(null); setDescription("");
    } catch (e) { setError(e.message); }
    setBusy(false);
  }
  return (
    <div style={{maxWidth:900,margin:"0 auto",padding:"28px 24px 60px",fontFamily:"'DM Sans',sans-serif"}}>
      <h1 style={{fontFamily:"Outfit,sans-serif",fontSize:28,color:T.text}}>🎯 Green Targets</h1>
      <p style={{color:T.textSec,lineHeight:1.7,margin:"8px 0 22px"}}>Choose any 5 of the 17 SDGs. Complete an action supporting each goal and submit a photo or video with a description.</p>
      <div style={{background:"#fff",border:`1px solid ${T.border}`,borderRadius:16,padding:24,marginBottom:24}}>
        <strong style={{color:T.green}}>{done >= 5 ? "✓ Five-goal challenge completed!" : `${done}/5 SDGs completed`}</strong>
        <span style={{display:"block",fontSize:13,color:T.textSec,marginTop:6}}>{done} of 17 goals documented · {Math.max(0,5-done)} more needed</span>
        <div style={{height:10,background:T.greenLight,borderRadius:8,marginTop:14,overflow:"hidden"}}><div style={{height:"100%",width:`${Math.min(done/5,1)*100}%`,background:T.green}} /></div>
        <p style={{fontSize:12,color:T.textSec,marginTop:12}}>Each SDG counts once after its evidence is saved. Submissions are self-reported and stored in this browser.</p>
        {done >= 5 ? <div style={{marginTop:18,padding:18,borderRadius:12,background:T.greenLight}}>
          <strong style={{display:"block",color:T.greenDark,marginBottom:10}}>🏅 Your certificate is ready!</strong>
          <button type="button" onClick={openCertificate} style={{padding:"12px 20px",background:T.green,color:"#fff",border:0,borderRadius:10,fontWeight:700,cursor:"pointer"}}>View certificate · Print / Save as PDF</button>
        </div> : <p style={{fontSize:13,color:T.textSec,marginTop:14}}>🏅 Complete five different SDGs to unlock your personalized certificate.</p>}
      </div>
      {error && <p role="alert" style={{color:"#b91c1c",marginBottom:16}}>{error}</p>}
      {!ready && !error && <p>Loading your saved targets…</p>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
        {SDGS.map(sdg => <button key={sdg.id} type="button" disabled={busy} aria-pressed={selected?.id === sdg.id} onClick={() => choose(sdg)} style={{textAlign:"left",padding:20,border:`1px solid ${selected?.id === sdg.id || completed.has(sdg.id)?T.green:T.border}`,borderTop:`5px solid ${sdg.color}`,borderRadius:12,background:selected?.id === sdg.id?T.greenLight:"#fff",cursor:"pointer",color:T.text}}>
          <span style={{fontSize:24}}>{sdg.icon}</span>
          <strong style={{display:"block",margin:"10px 0 7px",fontSize:14}}>SDG {sdg.id} · {sdg.name.replace(/\n/g," ")}</strong>
          <span style={{color:completed.has(sdg.id)?T.green:T.textSec,fontSize:12}}>{completed.has(sdg.id) ? "✓ Completed · View / replace evidence" : "Add photo or video + description"}</span>
        </button>)}
      </div>
      {selected && <section ref={evidenceRef} tabIndex={-1} aria-label={`Evidence for SDG ${selected.id}`} style={{scrollMarginTop:80,background:"#fff",border:`1px solid ${T.border}`,borderRadius:16,padding:24,marginTop:24}}>
        <h2 style={{fontSize:20,color:selected.color}}>SDG {selected.id} · {selected.name.replace(/\n/g," ")}</h2>
        <p style={{fontSize:14,color:T.textSec,lineHeight:1.6,margin:"10px 0"}}>{selected.desc}</p>
        {records.filter(r => r.sdgId === selected.id).map(r => <TargetEvidence key={r.key + r.createdAt} record={r} />)}
        <form onSubmit={submit} onPaste={event => { const pasted = Array.from(event.clipboardData.files).find(f => /^(image|video)\//.test(f.type)); if (pasted) { event.preventDefault(); acceptFile(pasted); } }}>
          <label style={{display:"block",fontWeight:600,margin:"18px 0 8px"}} htmlFor="target-media">Photo or video evidence</label>
          <input ref={inputRef} id="target-media" type="file" accept="image/*,video/*" disabled={busy} onChange={e => { setFile(null); acceptFile(e.target.files?.[0]); }} />
          <p style={{fontSize:12,color:T.textSec,marginTop:8}}>Choose a file or paste a copied photo or video into this form.</p>
          {preview && file && (file.type.startsWith("video/") ? <video src={preview} controls style={{width:"100%",maxHeight:320,marginTop:12}} /> : <img src={preview} alt="Selected SDG evidence" style={{width:"100%",maxHeight:320,objectFit:"contain",marginTop:12}} />)}
          <label htmlFor="target-description" style={{display:"block",fontWeight:600,margin:"18px 0 8px"}}>Describe your action</label>
          <textarea id="target-description" required maxLength={3000} rows={4} value={description} disabled={busy} onChange={e => setDescription(e.target.value)} placeholder="What did you do, and how does it support this SDG?" style={{width:"100%",padding:12,border:`1px solid ${T.border}`,borderRadius:10,font:"inherit"}} />
          <div style={{display:"flex",gap:12,marginTop:14}}>
            <button type="submit" disabled={busy || !ready || !file || !description.trim()} style={{padding:"12px 20px",background:T.green,color:"#fff",border:0,borderRadius:10,fontWeight:700,cursor:"pointer",opacity:busy || !ready || !file || !description.trim()?0.5:1}}>{busy ? "Saving…" : "Save evidence & complete SDG"}</button>
            <button type="button" disabled={busy} onClick={() => {setSelected(null);setFile(null);}} style={{background:"none",border:0,color:T.textSec,cursor:"pointer"}}>Close</button>
          </div>
        </form>
      </section>}
    </div>
  );
}

function TargetEvidence({ record }) {
  const [url, setUrl] = useState("");
  useEffect(() => {
    const objectUrl = URL.createObjectURL(record.media);
    setUrl(objectUrl);
    return () => URL.revokeObjectURL(objectUrl);
  }, [record.media]);
  return <div style={{padding:16,background:T.bg,borderRadius:12,marginTop:16}}>
    <strong style={{color:T.green}}>✓ Saved evidence</strong>
    <p style={{whiteSpace:"pre-wrap",margin:"10px 0",color:T.text}}>{record.description}</p>
    {url && (record.mediaType.startsWith("video/") ? <video src={url} controls style={{width:"100%",maxHeight:320}} /> : <img src={url} alt="Saved SDG evidence" style={{width:"100%",maxHeight:320,objectFit:"contain"}} />)}
    <p style={{fontSize:12,color:T.textSec,marginTop:8}}>{new Date(record.createdAt).toLocaleString()}</p>
  </div>;
}

          <input value={species} onChange={e => setSpecies(e.target.value)} placeholder="e.g. Neem, Banyan, Mango, Oak" style={{
            width: "100%", padding: "12px 16px", background: T.bg, border: `1px solid ${T.border}`, borderRadius: T.radiusSm,
            color: T.text, fontSize: 14, fontFamily: "'DM Sans',sans-serif", outline: "none", boxSizing: "border-box",
          }} />
        </div>
        <Btn color={T.green} full onClick={handlePlant} disabled={!location.trim() || planting}>
          {planting ? "Logging..." : "🌳 Plant This Tree"}
        </Btn>
      </div>

      {/* Tree log */}
      <h2 style={{ fontSize: 18, fontWeight: 700, color: T.text, fontFamily: "'Outfit',sans-serif", marginBottom: 14 }}>Your Tree Log</h2>
      {trees.length === 0 ? (
        <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 14, padding: "40px 20px", textAlign: "center", boxShadow: T.shadow }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>🌱</div>
          <p style={{ color: T.textSec, fontSize: 14, fontFamily: "'DM Sans',sans-serif", margin: 0 }}>No trees planted yet. Log your first tree above!</p>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {[...trees].reverse().map(t => (
            <div key={t.id} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: "14px 18px", display: "flex", alignItems: "center", gap: 14, boxShadow: T.shadow }}>
              <div style={{ width: 40, height: 40, borderRadius: 10, background: T.greenLight, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>🌳</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: T.text, fontFamily: "'DM Sans',sans-serif" }}>{t.species}</div>
                <div style={{ fontSize: 13, color: T.textSec, fontFamily: "'DM Sans',sans-serif" }}>📍 {t.location}</div>
              </div>
              <div style={{ fontSize: 12, color: T.muted, fontFamily: "'DM Sans',sans-serif" }}>{new Date(t.date).toLocaleDateString()}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── app ───
function viewFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const view = params.get("view");
  if (view === "sdg") {
    const sdg = SDGS.find(s => s.id === Number(params.get("id")));
    if (sdg) return { page: "sdg", sdg };
  }
  return { page: ["community", "targets"].includes(view) ? view : "home", sdg: null };
}

function App() {
  const initial = viewFromUrl();
  const [page, setPage] = useState(initial.page);
  const [selectedSDG, setSelectedSDG] = useState(initial.sdg);

  // Keep the page in step with the browser's back / forward buttons.
  useEffect(() => {
    const onPop = () => { const v = viewFromUrl(); setPage(v.page); setSelectedSDG(v.sdg); };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  const openSDG = (sdg) => {
    history.pushState({ ipsFromGrid: true }, "", "?view=sdg&id=" + sdg.id);
    setSelectedSDG(sdg); setPage("sdg"); window.scrollTo(0, 0);
  };
  const backToGrid = () => {
    if (history.state && history.state.ipsFromGrid) { history.back(); return; }
    history.replaceState(null, "", window.location.pathname);
    setPage("home"); setSelectedSDG(null); window.scrollTo(0, 0);
  };
  const [targets, setTargets] = useState([]);
  const [trees, setTrees] = useState([]);
  const [toast, setToast] = useState(null);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    const t = load("sdg-targets"), tr = load("sdg-trees");
    const savedTargets = Array.isArray(t) ? t.filter(item => !/^t[1-8]$/.test(String(item.id))) : [];
    const realTargets = savedTargets;
    setTargets(realTargets); if (tr) setTrees(tr);
    save("sdg-targets", realTargets);
    setLoaded(true);
  }, []);

  const notify = useCallback((text, icon) => setToast({ text, icon }), []);

  const handleToggleTarget = (id) => {
    const up = targets.map(t => t.id === id ? { ...t, done: !t.done } : t);
    setTargets(up); save("sdg-targets", up);
    const target = up.find(t => t.id === id);
    if (target?.done) notify("Target completed!", "🎯");
  };

  const handleAddTarget = (text) => {
    const up = [...targets, { id: Date.now().toString(), text, done: false, sdg: 13 }];
    setTargets(up); save("sdg-targets", up);
    notify("Target added!", "🎯");
  };

  const handlePlantTree = (tree) => {
    const up = [...trees, tree]; setTrees(up); save("sdg-trees", up);
    notify(`${tree.species} planted at ${tree.location}!`, "🌳");
  };

  if (!loaded) return React.createElement('div', {style: {background: T.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center"}}, React.createElement('div', {style: {color: T.textSec, fontFamily: "'DM Sans',sans-serif"}}, 'Loading...'));

  return (
    <div style={{ background: T.bg, minHeight: "100vh" }}>
      {toast && <Toast msg={toast} onClose={() => setToast(null)} />}
      {page === "home" && !selectedSDG && <HomePage onSelectSDG={openSDG} />}
      {page === "sdg" && selectedSDG && <SDGPage sdg={selectedSDG} onBack={backToGrid} />}
      {page === "community" && <CommunityPage />}
      {page === "targets" && <GreenTargetsPage />}
      <footer style={{ borderTop: `1px solid ${T.border}`, padding: "24px 28px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, background: "#fff" }}>
        <span style={{ fontSize: 13, color: T.muted, fontFamily: "'DM Sans',sans-serif" }}>🌍 IPS Green Vision © 2026</span>
        <span style={{ fontSize: 13, color: T.muted, fontFamily: "'DM Sans',sans-serif" }}>Created by Aayann K Jain · Indirapuram Public School</span>
      </footer>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
