// â”€â”€â”€ storage â”€â”€â”€
function load(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

function formatPostDate(post) {
  if (post.createdAt) {
    return new Date(post.createdAt).toLocaleString(undefined, {
      day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit"
    });
  }
  return post.time || "";
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read this picture."));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error("This picture format could not be opened."));
      image.onload = () => {
        const maxSide = 1200;
        const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function PostInteractions({ post, onUpdate, responseLabel = "Comment" }) {
  const [showResponse, setShowResponse] = useState(false);
  const [response, setResponse] = useState("");
  const comments = Array.isArray(post.comments) ? post.comments : [];

  const toggleLike = () => {
    const liked = !post.likedByYou;
    onUpdate(post.id, {
      likedByYou: liked,
      likes: Math.max(0, (Number(post.likes) || 0) + (liked ? 1 : -1)),
    });
  };

  const submitResponse = () => {
    if (!response.trim()) return;
    onUpdate(post.id, {
      comments: [...comments, {
        id: Date.now().toString(),
        user: "You",
        text: response.trim(),
        createdAt: new Date().toISOString(),
      }],
    });
    setResponse("");
    setShowResponse(false);
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button type="button" onClick={toggleLike} style={{ border: "none", background: post.likedByYou ? "#FEE2E2" : T.bg, color: post.likedByYou ? "#DC2626" : T.muted, borderRadius: 8, padding: "7px 11px", cursor: "pointer", fontSize: 13, fontFamily: "'DM Sans',sans-serif", fontWeight: 600 }}>
          {post.likedByYou ? "â™¥" : "â™¡"} {post.likes || 0}
        </button>
        <button type="button" onClick={() => setShowResponse(!showResponse)} style={{ border: "none", background: T.bg, color: T.textSec, borderRadius: 8, padding: "7px 11px", cursor: "pointer", fontSize: 13, fontFamily: "'DM Sans',sans-serif", fontWeight: 600 }}>
          ðŸ’¬ {responseLabel}{comments.length ? ` (${comments.length})` : ""}
        </button>
      </div>

      {comments.length > 0 && (
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
          {comments.map(comment => (
            <div key={comment.id} style={{ background: T.bg, border: `1px solid ${T.borderLight}`, borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 12, marginBottom: 4 }}>
                <strong style={{ color: T.text, fontSize: 12, fontFamily: "'DM Sans',sans-serif" }}>{comment.user || "You"}</strong>
                <span style={{ color: T.muted, fontSize: 11, fontFamily: "'DM Sans',sans-serif" }}>{formatPostDate(comment)}</span>
              </div>
              <div style={{ color: T.textSec, fontSize: 13, lineHeight: 1.5, fontFamily: "'DM Sans',sans-serif" }}>{comment.text}</div>
            </div>
          ))}
        </div>
      )}

      {showResponse && (
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <input value={response} onChange={e => setResponse(e.target.value)} onKeyDown={e => e.key === "Enter" && submitResponse()} autoFocus placeholder={`Write a ${responseLabel.toLowerCase()}...`} style={{ flex: 1, minWidth: 0, padding: "10px 12px", border: `1px solid ${T.border}`, borderRadius: 9, background: "#fff", color: T.text, outline: "none", fontSize: 13, fontFamily: "'DM Sans',sans-serif" }} />
          <button type="button" onClick={submitResponse} disabled={!response.trim()} style={{ border: "none", borderRadius: 9, padding: "0 15px", background: response.trim() ? T.green : T.muted, color: "#fff", cursor: response.trim() ? "pointer" : "not-allowed", fontWeight: 700, fontFamily: "'DM Sans',sans-serif" }}>Post</button>
        </div>
      )}
    </div>
  );
}

}

function CityPulsePage() {
  const [city, setCity] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);

  const search = async () => {
    if (!city.trim()) return;
    setLoading(true); setResult(null);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6", max_tokens: 1000,
          system: `You are City Pulse AI, an environmental satellite data analyst. When given a city name, provide a structured environmental report using real satellite-derived data and estimates. Format your response EXACTLY as JSON with no backticks or extra text:
{"city":"City Name","country":"Country","aqi":number,"aqiLabel":"Good/Moderate/Unhealthy","greenCover":number(percentage),"waterBodies":number(count),"avgTemp":"XXÂ°C","co2Level":"XXX ppm","deforestation":"XX% change","ndvi":number(0-1 vegetation index),"urbanExpansion":"XX% in last decade","renewableEnergy":"XX%","biodiversity":"description","alerts":["alert1","alert2"],"satellites":["Sentinel-2","Landsat-9","MODIS","etc"],"summary":"2-3 sentence environmental summary"}
Use realistic data based on your knowledge of the city. Be specific and accurate.`,
          messages: [{ role: "user", content: `Environmental satellite data report for: ${city.trim()}` }],
        }),
      });
      const data = await res.json();
      const text = data.content?.map(b => b.text || "").join("") || "";
      const clean = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      setResult(parsed);
    } catch (e) {
      setResult({ error: true, summary: "Could not analyze this city. Please try again." });

        }} />

      {/* Result */}
      {result && !result.error && (
        <div>
          {/* City header */}
          <div style={{ background: "linear-gradient(135deg, #0F1F0F, #1A3A1A)", borderRadius: 16, padding: "28px 24px", marginBottom: 20, color: "#fff" }}>
            <div style={{ fontSize: 13, color: "#86EFAC", fontFamily: "'DM Sans',sans-serif", marginBottom: 6 }}>ðŸ›°ï¸ Satellite Analysis</div>
            <h2 style={{ margin: "0 0 4px", fontSize: 26, fontWeight: 800, fontFamily: "'Outfit',sans-serif" }}>{result.city}</h2>
            <div style={{ fontSize: 14, color: "rgba(255,255,255,.6)", fontFamily: "'DM Sans',sans-serif" }}>{result.country}</div>
          </div>

          {/* Key metrics */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 20 }}>
            {[
              { l: "Air Quality (AQI)", v: result.aqi, sub: result.aqiLabel, c: aqiColor(result.aqi), i: "ðŸŒ¬ï¸" },
              { l: "Green Cover", v: `${result.greenCover}%`, sub: "Vegetation", c: T.green, i: "ðŸŒ¿" },
              { l: "NDVI Index", v: result.ndvi?.toFixed(2), sub: "Vegetation health", c: result.ndvi > 0.4 ? T.green : T.amber, i: "ðŸ“¡" },
              { l: "Avg Temperature", v: result.avgTemp, sub: "Annual mean", c: T.amber, i: "ðŸŒ¡ï¸" },

            ].map(s => (

                <div style={{ fontSize: 20, marginBottom: 6 }}>{s.i}</div>

          {/* More details */}

                ))}

// â”€â”€â”€ app â”€â”€â”€
function App() {
  const requestedView = new URLSearchParams(window.location.search).get("view");
  const [page, setPage] = useState(["community", "targets"].includes(requestedView) ? requestedView : "home");
  const [selectedSDG, setSelectedSDG] = useState(null);
  const [posts, setPosts] = useState([]);
  const [targets, setTargets] = useState([]);
  const [trees, setTrees] = useState([]);
  const [toast, setToast] = useState(null);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    const p = load("sdg-posts"), t = load("sdg-targets"), tr = load("sdg-trees");
    const realPosts = Array.isArray(p) ? p.filter(item => !/^s[1-5]$/.test(String(item.id))) : [];
    const savedTargets = Array.isArray(t) ? t.filter(item => !/^t[1-8]$/.test(String(item.id))) : [];
    const defaultIds = new Set(EASY_GREEN_TARGETS.map(item => item.id));
    const realTargets = [
      ...EASY_GREEN_TARGETS.map(item => savedTargets.find(saved => saved.id === item.id) || item),
      ...savedTargets.filter(item => !defaultIds.has(item.id)),
    ];
    setPosts(realPosts); setTargets(realTargets); if (tr) setTrees(tr);
    save("sdg-posts", realPosts); save("sdg-targets", realTargets);
    setLoaded(true);
  }, []);

  const notify = useCallback((text, icon) => setToast({ text, icon }), []);

  const handlePost = (post) => {
    const up = [post, ...posts]; setPosts(up); save("sdg-posts", up);
    notify("Action shared! ðŸŒ±", "âœ…");
  };

  const handleUpdatePost = (id, changes) => {
    const up = posts.map(post => post.id === id ? { ...post, ...changes } : post);
    setPosts(up);
    save("sdg-posts", up);
  };

  const handleToggleTarget = (id) => {
    const up = targets.map(t => t.id === id ? { ...t, done: !t.done } : t);
    setTargets(up); save("sdg-targets", up);
    const target = up.find(t => t.id === id);
    if (target?.done) notify("Target completed!", "ðŸŽ¯");
  };

  const handleAddTarget = (text) => {
    const up = [...targets, { id: Date.now().toString(), text, done: false, sdg: 13 }];
    setTargets(up); save("sdg-targets", up);
    notify("Target added!", "ðŸŽ¯");
  };

  const handlePlantTree = (tree) => {
    const up = [...trees, tree]; setTrees(up); save("sdg-trees", up);
    notify(`${tree.species} planted at ${tree.location}!`, "ðŸŒ³");
  };

  if (!loaded) return React.createElement('div', {style: {background: T.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center"}}, React.createElement('div', {style: {color: T.textSec, fontFamily: "'DM Sans',sans-serif"}}, 'Loading...'));

  return (
    <div style={{ background: T.bg, minHeight: "100vh" }}>
      {toast && <Toast msg={toast} onClose={() => setToast(null)} />}
      {page === "home" && !selectedSDG && <HomePage onSelectSDG={(s) => { setSelectedSDG(s); setPage("sdg"); }} />}
      {page === "sdg" && selectedSDG && <SDGPage sdg={selectedSDG} posts={posts} onPost={handlePost} onUpdatePost={handleUpdatePost} onBack={() => { setPage("home"); setSelectedSDG(null); }} />}
      {page === "community" && <CommunityPage posts={posts} onUpdatePost={handleUpdatePost} />}
      {page === "targets" && <GreenTargetsPage targets={targets} onToggle={handleToggleTarget} onAdd={handleAddTarget} />}
      <footer style={{ borderTop: `1px solid ${T.border}`, padding: "24px 28px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, background: "#fff" }}>
        <span style={{ fontSize: 13, color: T.muted, fontFamily: "'DM Sans',sans-serif" }}>ðŸŒ IPS Green Vision Â© 2026</span>
        <span style={{ fontSize: 13, color: T.muted, fontFamily: "'DM Sans',sans-serif" }}>Created by Aayann K Jain Â· Indirapuram Public School</span>
      </footer>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
